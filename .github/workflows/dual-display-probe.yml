name: Minimal dual display probe
on:
  push:
    branches: [experiment/dual-display-probe]
    paths: ['cluster-probe/**', '.github/workflows/dual-display-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone probe and lint
        run: gradle -p cluster-probe :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify two-activity APK
        run: |
          mkdir -p delivery
          cp cluster-probe/app/build/outputs/apk/debug/app-debug.apk delivery/DualDisplayProbe-0.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose delivery/DualDisplayProbe-0.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree delivery/DualDisplayProbe-0.1.apk AndroidManifest.xml > delivery/manifest.txt
          test "$(grep -c 'E: activity ' delivery/manifest.txt)" = 2
          ! grep -q 'E: uses-permission ' delivery/manifest.txt
          cd delivery
          sha256sum DualDisplayProbe-0.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DualDisplayProbe-0.1
          path: delivery/
      - name: Publish probe APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dual-display-probe-0.1-${GITHUB_SHA::7}"
          gh release create "$tag" delivery/DualDisplayProbe-0.1.apk delivery/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Minimal two-activity display probe 0.1" --notes-file cluster-probe/README.md
