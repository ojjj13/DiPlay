name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Verify source-only Test 24 APK
        if: github.event_name == 'pull_request' && github.head_ref == 'recovery/test24-20261008'
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil, zipfile
          source = pathlib.Path("mobile/build/outputs/apk/debug/mobile-debug.apk")
          blocked = {".pk8", ".p7b", ".key", ".pem", ".p12", ".pfx", ".jks", ".keystore"}
          private_block = re.compile(rb'-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{40,}')
          with zipfile.ZipFile(source) as apk:
              for name in apk.namelist():
                  if "offline-mfi" in name.lower() or pathlib.PurePosixPath(name).suffix.lower() in blocked:
                      raise SystemExit("Authentication or credential file in source-only APK: " + name)
                  if not name.endswith("/") and private_block.search(apk.read(name)):
                      raise SystemExit("Private key block in source-only APK: " + name)
          pathlib.Path("source-only-delivery").mkdir()
          shutil.copy2(source, "source-only-delivery/DiPlay-Test24-source-only.apk")
          print("Source-only APK verified: no authentication assets or private-key containers.")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose source-only-delivery/DiPlay-Test24-source-only.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging source-only-delivery/DiPlay-Test24-source-only.apk | grep -F "versionName='0.2.12-dilink4-cluster-test24'"
      - name: Upload source-only Test 24 APK
        if: github.event_name == 'pull_request' && github.head_ref == 'recovery/test24-20261008'
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Test24-source-only-APK
          path: source-only-delivery/DiPlay-Test24-source-only.apk
          if-no-files-found: error
          retention-days: 7
      - name: Require standalone authentication before Test 24 delivery
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/decoder-color-test24'
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path("mobile/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit("Expected exactly one Test 24 APK")
          with zipfile.ZipFile(apks[0]) as apk:
              for name in ("assets/offline-mfi/identity.pk8", "assets/offline-mfi/certificate.p7b"):
                  if name not in apk.namelist() or not apk.getinfo(name).file_size:
                      raise SystemExit("Source-only APK: standalone CarPlay authentication is absent; refusing test release")
          PY
      - name: Upload Test 24 APK
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/decoder-color-test24'
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Test24-APK
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html

  publish-test24:
    needs: check
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/decoder-color-test24' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-Test24-APK
          path: dist
      - name: Publish Test 24 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=$(find dist -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" dist/DiPlay-Test24.apk
          gh release create "test24-${{ github.event.pull_request.head.sha }}" \
            dist/DiPlay-Test24.apk \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "DiPlay Test 24" \
            --notes "Experimental decoder color build: BT.709 override and Qualcomm VPP probe. Both options default off." \
            --prerelease
